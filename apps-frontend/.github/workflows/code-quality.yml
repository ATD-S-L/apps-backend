name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint 2>&1 || true
      
      - name: Check code formatting
        run: npm run format:check 2>&1 || true
      
      - name: Run type checks
        if: hashFiles('tsconfig.json') != ''
        run: npm run type-check 2>&1 || true
      
      - name: Generate code metrics
        run: |
          echo "Frontend Code Quality Metrics"
          echo "=============================="
          echo "Total components: $(find src -name '*.tsx' -o -name '*.jsx' | wc -l)"
          echo "Total styles: $(find src -name '*.css' -o -name '*.scss' | wc -l)"
      
      - name: Archive code quality reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-report
          path: |
            coverage/
            .eslintrc*
          retention-days: 30
          if-no-files-found: ignore

  performance:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for analysis
        run: npm run build 2>&1 || true
      
      - name: Analyze bundle size
        run: |
          npm install -g webpack-bundle-analyzer 2>/dev/null || true
          echo "Bundle analysis - review dist build output"
