name: Build Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [esp32, esp32s3, esp32c3]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Build binary for ${{ matrix.board }}
        run: platformio run -e ${{ matrix.board }}
      
      - name: Create release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          cp .pio/build/${{ matrix.board }}/firmware.bin release/firmware-${{ matrix.board }}.bin
          cp .pio/build/${{ matrix.board }}/firmware.elf release/firmware-${{ matrix.board }}.elf
      
      - name: Upload binary artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-binaries-${{ matrix.board }}
          path: .pio/build/${{ matrix.board }}/
          retention-days: 90
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
